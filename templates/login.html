<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#E60023">
  <title>Sign In — PinBot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #E60023;
      --red-dark: #ad081b;
      --gray-50: #f8f8f8;
      --gray-200: #e0e0e0;
      --gray-600: #616161;
      --white: #ffffff;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--gray-50);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 380px;
      overflow: hidden;
    }

    .login-header {
      background: var(--red);
      padding: 36px 32px 28px;
      text-align: center;
    }

    .login-header svg {
      width: 48px;
      height: 48px;
      fill: white;
      margin-bottom: 12px;
    }

    .login-header h1 {
      color: white;
      font-size: 24px;
      font-weight: 700;
    }

    .login-header p {
      color: rgba(255,255,255,0.85);
      font-size: 14px;
      margin-top: 4px;
    }

    .login-body {
      padding: 32px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-600);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input[type="password"] {
      width: 100%;
      font-family: var(--font);
      font-size: 16px;
      padding: 14px 16px;
      border: 2px solid var(--gray-200);
      border-radius: 12px;
      background: var(--white);
      color: #212121;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="password"]:focus {
      border-color: var(--red);
    }

    .error-msg {
      background: #fff0f2;
      color: var(--red);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .btn-login {
      display: block;
      width: 100%;
      background: var(--red);
      color: white;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 700;
      padding: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-login:hover { background: var(--red-dark); }
    .btn-login:active { transform: scale(0.98); }

    .login-footer {
      text-align: center;
      padding: 16px 32px 28px;
      color: var(--gray-600);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 0C5.373 0 0 5.373 0 12c0 5.084 3.163 9.426 7.627 11.174-.105-.949-.2-2.405.042-3.441.218-.937 1.407-5.965 1.407-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738a.36.36 0 0 1 .083.345l-.333 1.36c-.053.22-.174.267-.402.161-1.499-.698-2.436-2.889-2.436-4.649 0-3.785 2.75-7.262 7.929-7.262 4.163 0 7.398 2.967 7.398 6.931 0 4.136-2.607 7.464-6.227 7.464-1.216 0-2.359-.632-2.75-1.378l-.748 2.853c-.271 1.043-1.002 2.35-1.492 3.146C9.57 23.812 10.763 24 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/>
      </svg>
      <h1>PinBot</h1>
      <p>Pinterest Affiliate Automation</p>
    </div>

    <div class="login-body">
      {% if error %}
        <div class="error-msg">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('main.login') }}">
        <label for="password">Dashboard Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          autofocus
          required
        >
        <button type="submit" class="btn-login">Sign In</button>
      </form>
    </div>

    <div class="login-footer">
      Set your password via the <code>DASHBOARD_PASSWORD</code> environment variable.
    </div>
  </div>
</body>
</html>
