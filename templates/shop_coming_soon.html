<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="p:domain_verify" content="f64f551a7a5cab819b81095bd1b6433a"/>
    <title>Aura Girl Essentials — Coming Soon</title>
    <meta name="description" content="Hand-picked Amazon beauty, home, and wellness finds — coming soon.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #faf7f5;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        .brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.375rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #1a1a1a;
            margin-bottom: 3rem;
        }

        .brand em { font-style: italic; color: #c9728a; }

        .visual {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #f5e6ea, #ede8e5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 2rem;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 500;
            color: #1a1a1a;
            line-height: 1.2;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
        }

        h1 em { font-style: italic; color: #c9728a; }

        p {
            font-size: 1rem;
            color: #6a6a6a;
            max-width: 380px;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: #f0e8e4;
            color: #c9728a;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.5rem 1.25rem;
            border-radius: 999px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #c9728a;
            border-radius: 50%;
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .divider {
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, #c9728a, #b89a6a);
            border-radius: 2px;
            margin: 2.5rem auto;
        }

        .footer-text {
            font-size: 0.8rem;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="brand">Aura <em>Girl</em> Essentials</div>

    <div class="visual">✨</div>

    <h1>Something <em>Beautiful</em><br>is Coming</h1>
    <p>We're putting the finishing touches on our curated shop. Check back soon for hand-picked finds in beauty, home, and wellness.</p>

    <span class="pill">
        <span class="dot"></span>
        Coming Soon
    </span>

    <div class="divider"></div>
    <p class="footer-text">Curated finds for your most radiant life</p>
</body>
</html>
